name: block_puzzle
description: Production-ready Flutter block puzzle game using Clean Architecture, Cubit, ads, and RevenueCat purchases.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  get_it: ^8.0.3
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  google_mobile_ads: ^7.0.0
  purchases_flutter: ^8.8.1
  flutter_svg: ^2.0.17
  animations: ^2.0.11
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.5
  path_provider: ^2.1.5
  package_info_plus: ^8.2.1
  url_launcher: ^6.3.2
  firebase_core: ^3.12.1
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
